<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7eclipses - Offers Live</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding-bottom:90px}
header{padding:25px;text-align:center;border-bottom:1px solid #222}
.offer-strip{background:#00ff88;color:#000;padding:8px;text-align:center;font-weight:bold;font-size:13px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.7}}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}
.card{background:#141414;border-radius:16px;padding:14px;border:1px solid #222}
.card img{width:100%;height:300px;object-fit:cover;border-radius:12px;background:#1a1a1a}
.price{color:#00ff88;font-weight:bold;font-size:18px;margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:9px;border-radius:8px;border:1px solid #333;background:#1f1f1f;color:#fff;cursor:pointer}
.btn.buy{background:#fff;color:#000;font-weight:bold;grid-column:span 2}
.btn.wish.active{background:#ff2d55}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:99}
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:#fff;color:#000;padding:25px;border-radius:20px;width:90%;max-width:380px;text-align:center;z-index:999;transition:0.3s;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.popup.show{transform:translate(-50%,-50%) scale(1)}
.popup h2{margin:0 0 10px 0}
.popup .gift{font-size:40px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;z-index:998}
.overlay.show{display:block}
</style>
</head>
<body>

<div class="offer-strip">🔥 OFFER: 2 Tees @ ₹1149 FREE Delivery + Gift | 3 Tees @ ₹1599 FREE + 2 Gifts</div>
<header><h1>7ECLIPSES</h1><p>Select 2 or 3 for Best Offer</p></header>

<div class="products" id="grid"></div>

<div class="cart-bar">
<div>🛒 <span id="count">0</span> Tees | <span id="totalText">₹0</span></div>
<button onclick="checkout()" style="background:#00ff88;color:#000;padding:10px 20px;border-radius:10px;font-weight:bold;border:none;cursor:pointer">Checkout</button>
</div>

<div class="overlay" id="overlay" onclick="closePop()"></div>
<div class="popup" id="popup">
<div class="gift" id="giftIcon">🎁</div>
<h2 id="popTitle">Offer Unlocked!</h2>
<p id="popDesc"></p>
<p style="font-size:12px;opacity:0.6">COD Charge ₹70 | Online Payment ₹50</p>
<button onclick="closePop()" style="background:#000;color:#fff;padding:10px 20px;border-radius:8px;border:none;margin-top:10px;cursor:pointer">Continue Shopping</button>
<button onclick="closePop();checkout()" style="background:#00ff88;color:#000;padding:10px 20px;border-radius:8px;border:none;margin-top:10px;margin-left:8px;font-weight:bold;cursor:pointer">Pay Now</button>
</div>

<script>
const PAY_LINK = "https://razorpay.me/@7eclipses";
const products=[
["Minimal-Whale-Logo-black.jpeg","Minimal Whale Black"],["Minimal-Whale-Logo-white.jpeg","Minimal Whale White"],
["My-EGO-is-protaction-black.jpeg","My EGO Black"],["My-EGO-is-protaction-white.jpeg","My EGO White"],
["genial-man-black.jpeg","Gentle Man Black"],["gental-mon-white.jpeg","Gentle Man White"],
["apna-haq-black.jpeg","Apna HAQ Black"],["apna-haq-white.jpeg","Apna HAQ White"],
["rainy-days-black.jpeg","Rainy Days Black"],["rainy-days-white.jpeg","Rainy Days White"],
["just-be-yourself-black (2).jpeg","Just Be Yourself Black"],["just-be-yourself-white.jpeg","Just Be Yourself White"],
["be-strong-lavender (2).jpeg","Be Strong Lavender"],["be-strong-white.jpeg","Be Strong White"]
];

let cart=[];
const grid=document.getElementById('grid');
products.forEach(p=>{
grid.innerHTML+=`<div class="card"><img src="${p[0]}"><h3>${p[1]}</h3><div class="price">₹599</div><div class="btns"><button class="btn wish" onclick="addCart(this,'${p[1]}')">♡ Wishlist</button><button class="btn" onclick="shareP('${p[1]}')">↗ Share</button><button class="btn buy" onclick="buySingle('${p[1]}')">Buy Now</button></div></div>`;
});

function getOffer(n){
if(n==0) return {total:0,msg:"",title:""};
if(n==1) return {total:649, save:0, title:"1 Tee Added", msg:"Add 1 more to get at ₹1149 FREE Delivery + 1 Free Gift 🎁<br><br><b>Current: ₹599 + ₹50 Online = ₹649</b><br>or ₹669 on COD", gift:"🛍️"};
if(n==2) return {total:1149, save:49, title:"2 Tees Offer Unlocked! 🔥", msg:"You Saved ₹49!<br><b>2 Tees = ₹1149</b><br>FREE Delivery + 1 Free Gift 🎁<br><br>COD: ₹1149 | Online: ₹1149", gift:"🎁"};
if(n>=3){
let sets=Math.floor(n/3); let rem=n%3;
let total=sets*1599;
let msg=`${sets*3} Tees = ₹${total} + `;
if(rem==1){total+=649; msg+=`1 Tee = ₹649 | Total ₹${total}`;}
else if(rem==2){total+=1149; msg+=`2 Tees = ₹1149 | Total ₹${total}`;}
else{msg=`${n} Tees = ₹${total}<br>FREE Delivery + ${n>=3? (sets*2 + (rem==2?1:0)) :0} Free Gifts`;}
if(n==3) return {total:1599, save:198, title:"MEGA OFFER! 3 @ ₹1599 🎉", msg:"Biggest Saving ₹198!<br><b>3 Tees = ₹1599</b><br>FREE Delivery + 2 Free Gifts 🎁🎁", gift:"🎉"};
return {total:total, save:0, title:`${n} Tees Offer`, msg:msg+"<br><b>Pay: ₹"+total+"</b>", gift:"🎁"};
}
}

function addCart(btn,name){
if(cart.includes(name)){cart=cart.filter(x=>x!==name);btn.classList.remove('active');btn.innerHTML='♡ Wishlist';}
else{cart.push(name);btn.classList.add('active');btn.innerHTML='♥ Added';showOffer();}
updateBar();
}

function updateBar(){
let offer=getOffer(cart.length);
document.getElementById('count').innerText=cart.length;
document.getElementById('totalText').innerText=cart.length==0?"₹0":"₹"+offer.total + (offer.save?` (Save ₹${offer.save})`:"");
}

function showOffer(){
let n=cart.length;
if(n==0) return;
let offer=getOffer(n);
document.getElementById('giftIcon').innerText=offer.gift;
document.getElementById('popTitle').innerHTML=offer.title;
document.getElementById('popDesc').innerHTML=offer.msg;
document.getElementById('popup').classList.add('show');
document.getElementById('overlay').classList.add('show');
}

function closePop(){document.getElementById('popup').classList.remove('show');document.getElementById('overlay').classList.remove('show');}

function buySingle(name){
cart=[name];
updateBar();
showOffer();
}

function checkout(){
if(cart.length==0){alert('Pehle product add karo');return;}
let offer=getOffer(cart.length);
let confirmMsg=`Your Order:\n${cart.join('\n')}\n\nTotal: ₹${offer.total}\n\nCOD Charge: ₹70 extra\nOnline: ₹50 extra (already included for 1 Tee, FREE for 2/3)\n\nYou will be redirected to Razorpay to pay ₹${offer.total}\n\nClick OK to Pay`;
if(confirm(confirmMsg)){
window.open(PAY_LINK,'_blank');
}
}

function shareP(name){
let t=`${name} - Only ₹599! 2 @1149, 3 @1599 FREE Delivery + Gifts on 7eclipses: ${location.href}`;
if(navigator.share){navigator.share({title:name,text:t,url:location.href});}
else{navigator.clipboard.writeText(t);alert('Link Copied!');}
}
</script>
</body>
</html>
